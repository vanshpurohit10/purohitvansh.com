<!doctype html>

<head>

<title>Vansh Purohit</title>
<meta name="description" content="Wealth management student and CFA Level I candidate in Mumbai, working toward investment research. Builder of Sparky.">
<link rel="canonical" href="https://purohitvansh.com/">
<style>
  :root {
    --paper: #f7f5f0;
    --ink: #1a1a1a;
    --muted: #5c5a55;
    --link: #1a1a1a;
    --rule: #d9d5cc;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #141414; --ink: #ecebe7; --muted: #a8a59e; --link: #ecebe7; --rule: #34332f; }
  }
  html, body { overflow-x: clip; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans);
    font-size: 18px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 18vh 1.25rem 4rem; }
  h1 { margin: 0 0 1rem; font-size: 2rem; line-height: 1.15; font-weight: 650; letter-spacing: -0.02em; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule); }
  a { color: var(--link); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 2px; }
  .soon { margin-top: 3rem; font-size: 0.95rem; }
</style>
</head>

    <a href="https://www.instagram.com/sparky.si/">Sparky on Instagram</a>
  </nav>
